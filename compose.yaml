
services:
  postgres:
    image: postgres:17-alpine
    container_name: bookly-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: bookly
      POSTGRES_PASSWORD: bookly_dev
      POSTGRES_DB: bookly

    ports:
      - "127.0.0.1:5434:5432"

    volumes:
      - bookly_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookly -d bookly"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bookly_postgres_data:
